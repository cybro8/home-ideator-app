<app-sidebar></app-sidebar>
<div class="page">
  <div class="header"><h2 id="deviceDataTitle">Device Data</h2></div>
  <div class="filters">
    <input id="deviceIdInput" [(ngModel)]="deviceId" placeholder="Device ID (firebase_key)"/>
    <input id="fromInput" [(ngModel)]="from" type="datetime-local"/>
    <input id="toInput" [(ngModel)]="to" type="datetime-local"/>
    <button id="loadDataBtn" (click)="load()">Load</button>
    <button id="downloadCsvBtn" (click)="downloadCsv()" [disabled]="!deviceId">CSV</button>
    <button id="downloadExcelBtn" (click)="downloadExcel()" [disabled]="!deviceId">Excel</button>
    <button id="liveRefreshBtn" (click)="toggleLive()" [class.active]="liveRefresh">
      {{ liveRefresh ? '⏹ Stop Live' : '▶ Live' }}
    </button>
  </div>
  <div *ngIf="loading" class="loader">Loading…</div>
  <table *ngIf="!loading && readings.length" id="readingsTable">
    <thead><tr><th>Timestamp</th><th>Voltage (V)</th><th>Current (A)</th><th>Power (W)</th><th>Temp (°C)</th><th>Status</th><th>Fault Score</th></tr></thead>
    <tbody>
      <tr *ngFor="let r of readings" [class.anomaly]="r.is_anomaly">
        <td>{{r.timestamp}}</td><td>{{r.Voltage|number:'1.2-2'}}</td>
        <td>{{r.Current|number:'1.3-3'}}</td><td>{{r.Power|number:'1.2-2'}}</td>
        <td>{{r.temperature_C|number:'1.1-1'}}</td>
        <td><span class="status" [class.ok]="r.status==='Active'">{{r.status}}</span></td>
        <td>{{r.fault_score|number:'1.3-3'}}</td>
      </tr>
    </tbody>
  </table>
  <div *ngIf="!loading && !readings.length && deviceId" class="empty">No readings found.</div>
</div>
